source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/01_introduccion.html#distribución-distro
question: |
  ¿Cuáles de estas son distribuciones de GNU/Linux? Marca todas las que apliquen.
options: ["Debian", "Fedora", "zsh", "Arch Linux", "Multics"]
answer: ["Debian", "Fedora", "Arch Linux"]
explanation: |
  Debian, Fedora y Arch Linux son distribuciones. zsh es un shell y Multics
  es un sistema operativo antiguo que inspiró a Unix.
