id: intro-006
module: 1
kind: quiz
format: multi_select
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/01_introduccion.html#interprete-de-comandos
question: |
  ¿Cuáles de estos son intérpretes de comandos (shells)? Marca todos los que apliquen.
options: ["bash", "zsh", "kitty", "fish", "GNOME Terminal", "sh"]
answer: ["bash", "zsh", "fish", "sh"]
explanation: |
  sh, bash, zsh y fish son shells: leen lo que escribes y lo ejecutan.
  kitty y GNOME Terminal son emuladores de terminal, las ventanas donde corren.
time_limit_sec: 30
lesson_time_limit_sec: 999999
hints:
  - "Dos de las opciones son ventanas, no intérpretes."
---
id: intro-007
module: 1
kind: quiz
format: multiple_choice
difficulty: 1
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/01_introduccion.html#interprete-de-comandos
question: |
  Abres una terminal, escribes `ls` y presionas Enter. ¿Qué programa lee esa
  línea, la interpreta y ejecuta la orden?
options: ["El intérprete de comandos (shell)", "El emulador de terminal", "El gestor de ventanas", "El BIOS"]
answer: "El intérprete de comandos (shell)"
explanation: |
  El emulador solo muestra texto y recibe el teclado. Quien «te pregunta qué
  quieres hacer» y ejecuta la orden es el shell.
time_limit_sec: 20
lesson_time_limit_sec: 999999
hints:
  - "Su nombre dice lo que hace con tus órdenes."
---
id: intro-008
module: 1
kind: quiz
format: true_false
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/01_introduccion.html#algunos-conceptos-importantes-para-fistas-y-leer-documentación
question: |
  Una terminal sin intérprete de comandos puede mostrar texto y recibir lo que
  tecleas, pero no ejecuta tus órdenes.
answer: "verdadero"
explanation: |
  La terminal es la vía de entrada y salida. Sin un shell que interprete lo que
  escribes, nadie convierte ese texto en acciones.
time_limit_sec: 20
lesson_time_limit_sec: 999999
hints:
  - "Separa quién muestra el texto de quién lo entiende."
---
id: intro-009
module: 1
kind: quiz
format: short_answer
difficulty: 1
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/01_introduccion.html#interprete-de-comandos
question: |
  ¿Cómo se llama el shell que viene por defecto en la mayoría de las
  distribuciones GNU/Linux y que usaremos en este curso?
answer: "bash"
accepted: ["Bourne Again Shell", "Bourne-Again Shell", "GNU bash"]
explanation: |
  bash (Bourne Again SHell) es el shell del proyecto GNU y el que encontrarás
  en casi cualquier servidor.
time_limit_sec: 30
lesson_time_limit_sec: 999999
hints:
  - "Cuatro letras; su nombre es un juego de palabras con «Bourne again»."
