# Módulo 1 · Conceptos: sistema operativo, kernel, terminal, intérprete, distribuciones.
id: intro-001
module: 1
kind: quiz
format: multiple_choice
difficulty: 1
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/01_introduccion.html#el-sistema-operativo-gnulinux-es-una-herramienta
question: |
  Tu computadora tiene memoria, procesador, disco y un teclado conectado.
  ¿Qué hace el sistema operativo con todo eso?
options:
  - "Administra esos recursos y los reparte entre los programas"
  - "Es la parte física que los conecta entre sí"
  - "Es el lenguaje con el que se programan los dispositivos"
  - "Es un navegador que permite usarlos desde internet"
answer: "Administra esos recursos y los reparte entre los programas"
explanation: |
  El sistema operativo es software: controla la memoria, el procesador y los
  dispositivos, y ofrece a los programas una forma sencilla de usarlos.
time_limit_sec: 25
lesson_time_limit_sec: 999999
hints:
  - "No es hardware: es un programa que manda sobre el hardware."
---
id: intro-002
module: 1
kind: quiz
format: multiple_choice
difficulty: 1
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/01_introduccion.html#kernel
question: |
  ¿Cómo se llama la parte del sistema operativo que habla directamente con el
  hardware y decide qué programa usa el procesador en cada momento?
options: ["El kernel (núcleo)", "El intérprete de comandos", "El emulador de terminal", "La distribución"]
answer: "El kernel (núcleo)"
explanation: |
  El kernel es el corazón del sistema: gestiona la memoria, los procesos y los
  dispositivos. Linux, en sentido estricto, es un kernel.
time_limit_sec: 20
lesson_time_limit_sec: 999999
hints:
  - "En español también se le dice «núcleo»."
---
id: intro-003
module: 1
kind: quiz
format: true_false
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/01_introduccion.html#kernel
question: |
  Solo con el kernel Linux, sin intérprete de comandos ni herramientas básicas,
  ya tienes un sistema listo para que una persona trabaje en él.
answer: "falso"
explanation: |
  El kernel administra el hardware, pero por sí solo no te da una forma de
  pedirle cosas. Hacen falta un intérprete de comandos, utilidades como ls o cp
  y demás programas; por eso se habla del sistema completo como GNU/Linux.
time_limit_sec: 20
lesson_time_limit_sec: 999999
hints:
  - "¿Con qué programa le darías órdenes al kernel?"
---
id: intro-004
module: 1
kind: quiz
format: multiple_choice
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/01_introduccion.html#terminal
question: |
  En los primeros sistemas Unix, ¿qué era una «terminal»?
options:
  - "Un aparato con teclado y pantalla (o impresora) conectado a una computadora central"
  - "Una ventana dentro de un escritorio gráfico"
  - "El programa que interpreta los comandos"
  - "El último proceso que se ejecuta al apagar la máquina"
answer: "Un aparato con teclado y pantalla (o impresora) conectado a una computadora central"
explanation: |
  Originalmente la terminal era hardware: varias personas usaban la misma
  computadora grande, cada una desde su propia terminal física.
time_limit_sec: 25
lesson_time_limit_sec: 999999
hints:
  - "Piensa en una época en la que no existían los escritorios con ventanas."
---
id: intro-005
module: 1
kind: quiz
format: multiple_choice
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/01_introduccion.html#emulador-de-terminal
question: |
  kitty, GNOME Terminal o Konsole son ejemplos de...
options: ["Emuladores de terminal", "Intérpretes de comandos", "Kernels", "Distribuciones"]
answer: "Emuladores de terminal"
explanation: |
  Un emulador de terminal es un programa gráfico que imita a las terminales
  físicas. Dentro de él corre un intérprete de comandos, como bash o zsh.
time_limit_sec: 20
lesson_time_limit_sec: 999999
hints:
  - "Imitan en una ventana a un aparato que antes era físico."
