id: intro-012
module: 1
kind: quiz
format: multiple_choice
difficulty: 1
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/01_introduccion.html#formas-de-interactuar-con-el-so
question: |
  Te dan acceso a un servidor del laboratorio que no tiene entorno gráfico.
  ¿Cómo trabajas en él?
options:
  - "Con la interfaz de línea de comandos (CLI)"
  - "Con la interfaz gráfica de usuario (GUI)"
  - "Solo instalando un escritorio antes de usarlo"
  - "No se puede usar sin pantalla ni ratón"
answer: "Con la interfaz de línea de comandos (CLI)"
explanation: |
  En GNU/Linux la forma principal de interactuar es la línea de comandos; la
  interfaz gráfica es secundaria y muchos servidores ni siquiera la tienen.
time_limit_sec: 20
lesson_time_limit_sec: 999999
hints:
  - "Escribes órdenes en vez de hacer clic."
---
id: intro-013
module: 1
kind: quiz
format: short_answer
difficulty: 1
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/01_introduccion.html#formas-de-interactuar-con-el-so
question: |
  ¿Qué siglas en inglés se usan para la interfaz de línea de comandos?
answer: "CLI"
accepted: ["command line interface", "command-line interface"]
explanation: |
  CLI significa Command Line Interface. Su contraparte es la GUI
  (Graphical User Interface).
time_limit_sec: 20
lesson_time_limit_sec: 999999
hints:
  - "Tres letras; la contraparte es GUI."
