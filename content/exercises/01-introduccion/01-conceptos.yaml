id: intro-010
module: 1
kind: quiz
format: multiple_choice
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/01_introduccion.html#distribución-distro
question: |
  ¿Qué es una distribución de GNU/Linux?
options:
  - "El kernel Linux junto con herramientas, programas y un gestor de paquetes, listos para instalar"
  - "Una versión del kernel Linux modificada por cada fabricante de computadoras"
  - "Un intérprete de comandos alternativo a bash"
  - "Un servidor desde el que se descarga internet"
answer: "El kernel Linux junto con herramientas, programas y un gestor de paquetes, listos para instalar"
explanation: |
  Debian, Fedora o Arch toman el mismo kernel y lo empaquetan con herramientas
  GNU, un gestor de paquetes y sus propias decisiones de configuración.
time_limit_sec: 25
lesson_time_limit_sec: 999999
hints:
  - "Piensa en un «paquete completo» que puedes instalar."
