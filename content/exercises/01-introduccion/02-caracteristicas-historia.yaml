id: intro-021
module: 1
kind: quiz
format: multiple_choice
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/01_introduccion.html#breve-historia-del-so-gnulinux
question: |
  ¿Por qué se habla de «GNU/Linux» y no solo de «Linux»?
options:
  - "Porque el sistema completo une las herramientas del proyecto GNU con el kernel Linux"
  - "Porque GNU es la empresa que vende Linux"
  - "Porque GNU es la versión gráfica de Linux"
  - "Porque Linux es un programa que corre dentro de GNU Hurd"
answer: "Porque el sistema completo une las herramientas del proyecto GNU con el kernel Linux"
explanation: |
  A GNU le faltaba un kernel terminado y Linux era solo un kernel. Juntos, desde
  1992, forman un sistema operativo completo y libre.
time_limit_sec: 25
lesson_time_limit_sec: 999999
hints:
  - "Cada nombre aporta una parte distinta del sistema."
