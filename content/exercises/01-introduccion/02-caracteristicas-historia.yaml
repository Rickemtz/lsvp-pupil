id: intro-015
module: 1
kind: quiz
format: multiple_choice
difficulty: 1
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/01_introduccion.html#algunas-características-del-so-gnulinux
question: |
  Se dice que GNU/Linux es multiplataforma. ¿Qué significa?
options:
  - "Funciona en muchos tipos de equipo: computadoras personales, servidores, teléfonos, sistemas pequeños..."
  - "Se puede instalar al mismo tiempo que Windows en el mismo disco"
  - "Permite abrir varias terminales a la vez"
  - "Tiene varias interfaces gráficas para elegir"
answer: "Funciona en muchos tipos de equipo: computadoras personales, servidores, teléfonos, sistemas pequeños..."
explanation: |
  El kernel Linux corre en arquitecturas muy distintas, desde servidores y
  supercomputadoras hasta teléfonos y placas pequeñas.
time_limit_sec: 25
lesson_time_limit_sec: 999999
hints:
  - "«Plataforma» aquí se refiere al tipo de equipo."
