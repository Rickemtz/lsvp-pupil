question: |
  ¿Quién empezó a escribir el kernel Linux en 1991, cuando era estudiante en Helsinki?
answer: "Linus Torvalds"
accepted: ["Torvalds", "Linus"]
explanation: |
  Linus Torvalds publicó la primera versión de Linux en 1991 como un proyecto
  personal; el nombre viene de su propio nombre.
