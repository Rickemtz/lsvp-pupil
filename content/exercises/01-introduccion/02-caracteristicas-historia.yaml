id: intro-018
module: 1
kind: quiz
format: multiple_choice
difficulty: 3
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/01_introduccion.html#breve-historia-del-so-gnulinux
question: |
  ¿Dónde se desarrolló Unix a finales de los años 60?
options:
  - "En los Laboratorios Bell de AT&T"
  - "En la Universidad de Helsinki"
  - "En la Free Software Foundation"
  - "En Microsoft"
answer: "En los Laboratorios Bell de AT&T"
explanation: |
  Ken Thompson y Dennis Ritchie crearon Unix en los Laboratorios Bell, después
  de participar en el proyecto Multics.
time_limit_sec: 25
lesson_time_limit_sec: 999999
hints:
  - "Era un laboratorio de una compañía telefónica."
