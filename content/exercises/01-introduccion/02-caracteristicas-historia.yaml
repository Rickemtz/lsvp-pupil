id: intro-019
module: 1
kind: quiz
format: multiple_choice
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/01_introduccion.html#breve-historia-del-so-gnulinux
question: |
  En 1984 Richard Stallman inició un proyecto para crear un sistema operativo
  libre, compatible con Unix. ¿Cómo se llama?
options: ["GNU", "Linux", "Debian", "BSD"]
answer: "GNU"
explanation: |
  El proyecto GNU («GNU's Not Unix») creó el compilador, el shell bash y muchas
  de las herramientas que usarás en la terminal.
time_limit_sec: 20
lesson_time_limit_sec: 999999
hints:
  - "Su nombre es un acrónimo recursivo que niega ser Unix."
