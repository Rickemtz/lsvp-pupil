id: intro-022
module: 1
kind: quiz
format: multiple_choice
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/01_introduccion.html#qué-significa-aprender-a-utilizar-el-so-gnulinux
question: |
  ¿Cuál de estas tareas corresponde al uso de GNU/Linux como camino profesional,
  más allá del uso general?
options:
  - "Administrar un cluster de supercómputo"
  - "Navegar en internet"
  - "Ver una película"
  - "Editar un documento de texto"
answer: "Administrar un cluster de supercómputo"
explanation: |
  Además del uso diario, GNU/Linux es la base para administrar centros de
  datos, clusters de supercómputo e infraestructura en la nube.
time_limit_sec: 20
lesson_time_limit_sec: 999999
hints:
  - "Busca la opción que harías en un laboratorio como el LSVP."
