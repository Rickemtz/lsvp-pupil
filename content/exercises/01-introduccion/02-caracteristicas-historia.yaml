id: intro-017
module: 1
kind: quiz
format: multiple_choice
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/01_introduccion.html#breve-historia-del-so-gnulinux
question: |
  ¿Cuál de estos sistemas es el más antiguo?
options: ["Multics", "Unix", "GNU", "Linux"]
answer: "Multics"
explanation: |
  Orden: Multics (1964), Unix (1969), GNU (1984), Linux (1991) y la
  combinación GNU/Linux (1992).
time_limit_sec: 20
lesson_time_limit_sec: 999999
hints:
  - "Unix se inspiró en él."
