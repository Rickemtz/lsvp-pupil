# Módulo 2 · Conceptos: qué es un sistema de archivos, "todo es un archivo", componentes, árbol único.
id: fs-001
module: 2
kind: quiz
format: multiple_choice
difficulty: 1
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/03_sistemas_archivos.html#qué-es-un-sistema-de-archivos
question: |
  ¿Qué hace un sistema de archivos?
options:
  - "Organiza los datos de un disco en una jerarquía de directorios y archivos"
  - "Ejecuta los programas que el usuario abre"
  - "Conecta la computadora a internet"
  - "Muestra las ventanas del escritorio"
answer: "Organiza los datos de un disco en una jerarquía de directorios y archivos"
explanation: |
  Un disco solo guarda bloques de datos. El sistema de archivos los convierte
  en algo que podemos nombrar y ordenar: directorios y archivos.
time_limit_sec: 20
hints:
  - "Piensa en la palabra «archivo» y en «organizar»."
