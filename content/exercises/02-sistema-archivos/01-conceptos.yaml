id: fs-004
module: 2
kind: quiz
format: true_false
difficulty: 1
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/03_sistemas_archivos.html#Árbol-de-archivos
question: |
  En Windows cada disco tiene su propia letra (C:, D:...). En Linux, en cambio,
  todos los archivos cuelgan de un único árbol que empieza en /.
answer: "verdadero"
explanation: |
  Linux mantiene una sola jerarquía. Un disco nuevo no recibe una letra: se
  monta en algún directorio del árbol, por ejemplo en /mnt.
time_limit_sec: 20
hints:
  - "¿Cuántas raíces tiene el árbol?"
---
id: fs-005
module: 2
kind: quiz
format: multiple_choice
difficulty: 1
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/03_sistemas_archivos.html#caracteres-especiales-para-escribir-rutas
question: |
  En una ruta, ¿qué representa ..?
options: ["El directorio padre", "El directorio actual", "El directorio raíz", "El home del usuario"]
answer: "El directorio padre"
explanation: |
  Todo directorio tiene dos entradas especiales: . (él mismo) y .. (su padre).
  Por eso «cd ..» sube un nivel.
time_limit_sec: 20
hints:
  - "Un punto es «aquí»; dos puntos es un nivel arriba."
---
id: fs-006
module: 2
kind: quiz
format: short_answer
difficulty: 1
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/03_sistemas_archivos.html#_ruta_absoluta
question: |
  ¿Con qué carácter empieza toda ruta absoluta?
answer: "/"
accepted: ["la barra", "barra", "diagonal", "la diagonal", "slash"]
explanation: |
  Una ruta absoluta empieza en la raíz, que se escribe /. Por ejemplo:
  /home/alumno/taller.
time_limit_sec: 20
hints:
  - "Es el mismo carácter que separa los directorios."
---
id: fs-007
module: 2
kind: quiz
format: multiple_choice
difficulty: 1
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/03_sistemas_archivos.html#_ruta_relativa
question: |
  ¿Cuál de estas rutas es absoluta?
options: ["/home/alumno/taller", "taller/dia-1", "../taller", "./taller"]
answer: "/home/alumno/taller"
explanation: |
  Solo la que empieza con / es absoluta. Las demás son relativas: dependen del
  directorio en el que estés.
time_limit_sec: 20
hints:
  - "Busca la que empieza en la raíz."
