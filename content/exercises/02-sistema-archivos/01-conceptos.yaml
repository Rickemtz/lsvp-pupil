id: fs-003
module: 2
kind: quiz
format: multiple_choice
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/03_sistemas_archivos.html#componentes-de-un-sistema-de-archivos
question: |
  ¿Qué componente de un sistema de archivos decide quién puede leer o modificar
  cada archivo?
options: ["El modelo de seguridad (permisos)", "El namespace", "La API", "La implementación"]
answer: "El modelo de seguridad (permisos)"
explanation: |
  El namespace nombra y organiza, la API son las operaciones para manipular
  archivos, la implementación conecta todo con el hardware, y los permisos
  sirven para proteger, esconder o compartir.
time_limit_sec: 25
hints:
  - "Proteger, esconder y compartir."
