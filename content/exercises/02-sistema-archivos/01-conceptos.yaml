id: fs-002
module: 2
kind: quiz
format: true_false
difficulty: 1
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/03_sistemas_archivos.html#todo-es-un-archivo
question: |
  En un sistema tipo Unix, dispositivos como discos o terminales también se
  representan como archivos.
answer: "verdadero"
explanation: |
  «Todo es un archivo»: discos, terminales y hasta información de los procesos
  aparecen en el sistema de archivos (en /dev, /proc...) y se leen o escriben
  como flujos de bytes.
time_limit_sec: 20
hints:
  - "Recuerda la frase que resume la filosofía de Unix sobre los archivos."
