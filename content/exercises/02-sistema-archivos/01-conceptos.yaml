id: fs-008
module: 2
kind: quiz
format: true_false
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/03_sistemas_archivos.html#reglas
question: |
  Si un archivo tiene dos enlaces duros (dos nombres), su contenido se guarda
  dos veces en el disco.
answer: "falso"
explanation: |
  Un enlace duro es solo otro nombre para los mismos datos. Hay un único
  contenido con varios nombres; no está duplicado.
time_limit_sec: 25
hints:
  - "Un enlace es un nombre, no una copia."
