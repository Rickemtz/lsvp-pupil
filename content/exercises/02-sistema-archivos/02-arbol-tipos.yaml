id: fs-012
module: 2
kind: quiz
format: multiple_choice
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/03_sistemas_archivos.html#_tipos_de_archivos
question: |
  En la salida de «ls -l», el primer carácter de cada línea indica el tipo de
  archivo. ¿Qué significa una d?
options: ["Un directorio", "Un dispositivo", "Un archivo borrado", "Un enlace duro"]
answer: "Un directorio"
explanation: |
  Algunos tipos comunes: - archivo ordinario, d directorio, l enlace simbólico,
  b y c dispositivos de bloque y de caracteres.
time_limit_sec: 25
hints:
  - "Los archivos normales llevan un guion."
