source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/03_sistemas_archivos.html#Árbol-del-sistema
question: |
  Regresas de vacaciones y quieres saber si alguien intentó entrar a tu
  computadora. ¿Dónde buscas los registros (logs)?
options: ["/var", "/etc", "/home", "/bin"]
answer: "/var"
explanation: |
  /var guarda datos que cambian con el tiempo, como los registros del sistema
  en /var/log.
time_limit_sec: 25
hints:
  - "Los logs son datos que varían todo el tiempo."
