id: fs-011
module: 2
kind: quiz
format: multiple_choice
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/03_sistemas_archivos.html#Árbol-del-sistema
question: |
  Quieres ver qué discos reconoce el sistema. ¿En qué directorio aparecen como
  archivos?
options: ["/dev", "/mnt", "/proc", "/lib"]
answer: "/dev"
explanation: |
  /dev tiene archivos especiales que representan dispositivos: discos,
  particiones, terminales... Un disco suele verse como /dev/sda o /dev/nvme0n1.
time_limit_sec: 25
hints:
  - "Viene de «devices»."
