instructions: |
  Lista el contenido de taller incluyendo los archivos ocultos (los que empiezan
  con punto). Hay uno escondido.
checks:
  - type: output
    mode: regex
    expected: '(^|\s)\.oculto(\s|$)'
solution: "ls -a"
