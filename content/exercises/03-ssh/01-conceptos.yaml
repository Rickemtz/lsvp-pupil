id: ssh-008
module: 3
kind: quiz
format: multiple_choice
difficulty: 1
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/02_ssh.html#cómo-se-logra
question: |
  Alguien en la misma red wifi intercepta el tráfico entre tu laptop y el
  servidor mientras usas SSH. ¿Qué ve?
options:
  - "Datos cifrados que no puede leer"
  - "Todos los comandos que escribes"
  - "Tu contraseña, pero no los comandos"
  - "La pantalla del servidor"
answer: "Datos cifrados que no puede leer"
explanation: |
  SSH cifra toda la comunicación: contraseñas, comandos y resultados.
time_limit_sec: 20
hints:
  - "¿Qué hace el cifrado con los datos?"
