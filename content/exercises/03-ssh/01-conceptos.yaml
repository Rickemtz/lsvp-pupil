id: ssh-009
module: 3
kind: quiz
format: multiple_choice
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/02_ssh.html#cómo-lo-uso
question: |
  ¿Cuál de estos es un programa gráfico clásico para conectarse por SSH desde
  Windows?
options: ["PuTTY", "OpenSSH", "bash", "Konsole"]
answer: "PuTTY"
explanation: |
  PuTTY es un cliente SSH gráfico muy usado en Windows. OpenSSH es el cliente y
  servidor de línea de comandos que viene en Linux, macOS y en Windows recientes.
time_limit_sec: 25
hints:
  - "Tiene nombre de masilla en inglés."
