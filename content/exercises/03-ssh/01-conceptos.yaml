id: ssh-010
module: 3
kind: quiz
format: multiple_choice
difficulty: 1
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/02_ssh.html#para-usar-openssh
question: |
  En el comando «ssh ana@cluster.lsvp.example», ¿qué es ana?
options:
  - "El usuario con el que entras al servidor remoto"
  - "El nombre del servidor"
  - "Tu contraseña"
  - "El nombre de tu computadora"
answer: "El usuario con el que entras al servidor remoto"
explanation: |
  La forma es ssh USUARIO@DIRECCIÓN: antes de la @ va el usuario y después, la
  dirección del servidor (nombre o IP).
time_limit_sec: 20
hints:
  - "Lo que va antes de la @ es quién entra."
---
id: ssh-011
module: 3
kind: quiz
format: short_answer
difficulty: 1
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/02_ssh.html#para-usar-openssh
question: |
  Estás conectado por SSH a un servidor. ¿Qué comando escribes para cerrar la
  sesión y volver a tu computadora?
answer: "exit"
accepted: ["logout"]
explanation: |
  exit (o logout, o Ctrl-D) termina la shell remota y cierra la conexión.
time_limit_sec: 25
hints:
  - "Es el mismo comando con el que cierras cualquier shell."
