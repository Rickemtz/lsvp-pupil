# Módulo 3 · SSH: para qué sirve, cifrado, fingerprint, llaves.
id: ssh-001
module: 3
kind: quiz
format: multiple_choice
difficulty: 1
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/02_ssh.html#ssh--secure-shell
question: |
  ¿Qué es SSH?
options:
  - "Un protocolo de red cifrado para trabajar en otra computadora de forma segura"
  - "Un intérprete de comandos, como bash o zsh"
  - "Un programa para compartir la pantalla con otra persona"
  - "Una distribución de Linux para servidores"
answer: "Un protocolo de red cifrado para trabajar en otra computadora de forma segura"
explanation: |
  SSH (Secure Shell) permite operar una computadora remota a través de una red
  insegura, como internet, sin que otros puedan leer lo que viaja.
time_limit_sec: 20
hints:
  - "La S de SSH significa «secure»."
---
id: ssh-002
module: 3
kind: quiz
format: multiple_choice
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/02_ssh.html#ssh--secure-shell
question: |
  Antes de SSH se usaban programas como telnet para conectarse a otra máquina.
  ¿Qué problema tenían?
options:
  - "Todo, incluidas las contraseñas, viajaba por la red sin cifrar"
  - "Solo funcionaban dentro de la misma habitación"
  - "No permitían escribir comandos"
  - "Necesitaban una interfaz gráfica"
answer: "Todo, incluidas las contraseñas, viajaba por la red sin cifrar"
explanation: |
  Cualquiera que interceptara el tráfico podía leer las contraseñas. SSH surgió
  para resolver justamente ese problema de las redes inseguras.
time_limit_sec: 25
hints:
  - "Piensa en alguien espiando la red."
---
id: ssh-003
module: 3
kind: quiz
format: multi_select
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/02_ssh.html#se-usa-para
question: |
  ¿Para qué se usa SSH? Marca todas las que apliquen.
options:
  - "Iniciar sesión en una computadora remota"
  - "Cifrar otros tipos de comunicación entre dos máquinas"
  - "Hacer más rápida la conexión a internet"
  - "Saltarse los permisos del servidor"
answer:
  - "Iniciar sesión en una computadora remota"
  - "Cifrar otros tipos de comunicación entre dos máquinas"
explanation: |
  Sus dos usos principales son el login remoto y proteger otras comunicaciones
  (por ejemplo, copiar archivos o hacer túneles). No acelera la red ni da más
  permisos de los que ya tienes.
time_limit_sec: 30
hints:
  - "Dos opciones hablan de seguridad; las otras dos, de cosas que SSH no hace."
---
id: ssh-004
module: 3
kind: quiz
format: multiple_choice
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/02_ssh.html#cómo-se-logra
question: |
  La primera vez que te conectas a un servidor, ssh muestra su «fingerprint» y
  pregunta si confías en él. ¿Para qué sirve?
options:
  - "Para verificar que el servidor es el que crees y no un impostor"
  - "Para registrar tu huella digital en el servidor"
  - "Para elegir la velocidad de la conexión"
  - "Para crear tu contraseña"
answer: "Para verificar que el servidor es el que crees y no un impostor"
explanation: |
  El fingerprint es un resumen de la llave del servidor. Si lo comparas con el
  que te dio quien administra el servidor, sabes que hablas con la máquina correcta.
time_limit_sec: 25
hints:
  - "Una huella identifica a quien la deja."
---
id: ssh-005
module: 3
kind: quiz
format: true_false
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/02_ssh.html#cómo-se-logra
question: |
  ssh te avisa que el fingerprint de un servidor al que siempre te conectas
  cambió. Lo más seguro es aceptarlo y seguir.
answer: "falso"
explanation: |
  Un cambio inesperado puede significar que alguien se hace pasar por el
  servidor. Antes de aceptar, pregunta a quien lo administra si cambió la llave.
time_limit_sec: 25
hints:
  - "¿Qué pasaría si fuera un impostor?"
