id: ssh-006
module: 3
kind: quiz
format: multiple_choice
difficulty: 1
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/02_ssh.html#cómo-se-logra
question: |
  Creaste un par de llaves SSH. ¿Cuál puedes copiar a los servidores y compartir
  sin problema?
options: ["La llave pública", "La llave privada", "Las dos", "Ninguna"]
answer: "La llave pública"
explanation: |
  La pública se instala en los servidores; la privada se queda solo contigo y
  demuestra que eres tú.
time_limit_sec: 20
hints:
  - "Su nombre lo dice."
