id: ssh-007
module: 3
kind: quiz
format: true_false
difficulty: 1
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/02_ssh.html#cómo-se-logra
question: |
  La llave privada nunca debe compartirse ni copiarse a otras personas.
answer: "verdadero"
explanation: |
  Quien tenga tu llave privada puede entrar a tus servidores como si fueras tú.
time_limit_sec: 20
hints:
  - "Privada."
