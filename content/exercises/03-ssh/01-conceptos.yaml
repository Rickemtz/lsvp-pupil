id: ssh-012
module: 3
kind: quiz
format: multiple_choice
difficulty: 3
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_1/02_ssh.html#para-usar-openssh
question: |
  ¿En qué puerto escucha un servidor SSH si nadie lo cambió?
options: ["22", "80", "443", "8080"]
answer: "22"
explanation: |
  El puerto 22 es el predeterminado. Si un servidor usa otro, se indica con la
  opción -p, por ejemplo ssh -p 2222 usuario@servidor.
time_limit_sec: 20
hints:
  - "Es un número de dos cifras iguales."
