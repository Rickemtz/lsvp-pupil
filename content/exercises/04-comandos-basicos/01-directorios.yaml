id: basicos-005
module: 4
kind: practice
difficulty: 1
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_2/04_comandos_basicos.html#como-crear-un-directorio-mkdir
fixture: taller
start_dir: taller
instructions: |
  Dentro de taller, crea los directorios dir1, dir2, dir3 y dir4 con un solo
  comando.
checks:
  - type: fs
    is_dir: [taller/dir1, taller/dir2, taller/dir3, taller/dir4]
solution: "mkdir dir1 dir2 dir3 dir4"
