# Módulo 4 · touch, cp, mv, rmdir y rm.
id: basicos-006
module: 4
kind: practice
difficulty: 1
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_2/04_comandos_basicos.html#y-los-archivos-touch
fixture: taller
start_dir: taller/dir1
instructions: |
  Estás en dir1. Crea dos archivos vacíos, file.txt y documento, con un solo
  comando.
checks:
  - type: fs
    is_file: [taller/dir1/file.txt, taller/dir1/documento]
solution: "touch file.txt documento"
time_limit_sec: 60
lesson_time_limit_sec: 999999
hints:
  - "touch crea archivos vacíos y acepta varios nombres."
---
id: basicos-007
module: 4
kind: practice
difficulty: 1
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_2/04_comandos_basicos.html#crear-una-copia-cp
fixture: taller
start_dir: taller/dir1
setup:
  - echo 'primera versión' > file.txt
instructions: |
  Haz una copia de file.txt llamada file2.txt.
checks:
  - type: fs
    content_equals:
      taller/dir1/file.txt: "primera versión\n"
      taller/dir1/file2.txt: "primera versión\n"
solution: "cp file.txt file2.txt"
time_limit_sec: 45
lesson_time_limit_sec: 999999
hints:
  - "cp origen destino"
---
id: basicos-008
module: 4
kind: practice
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_2/04_comandos_basicos.html#crear-una-copia-cp
fixture: taller
start_dir: taller
setup:
  - mkdir -p proyecto/linux/basico dir2 && touch proyecto/documento
instructions: |
  Copia el directorio proyecto, con todo lo que tiene adentro, dentro de dir2.
checks:
  - type: fs
    is_dir: [taller/dir2/proyecto/linux/basico, taller/proyecto]
    exists: [taller/dir2/proyecto/documento]
solution: "cp -r proyecto dir2"
explanation: |
  Para copiar un directorio, cp necesita -r (recursivo); sin ella se niega.
time_limit_sec: 60
lesson_time_limit_sec: 999999
hints:
  - "Copiar un directorio requiere una opción de cp."
  - "La opción es -r (recursivo)."
---
id: basicos-009
module: 4
kind: practice
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_2/04_comandos_basicos.html#cómo-se-puede-mover-un-directorio-o-archivo-mv
fixture: taller
start_dir: taller/dir1
setup:
  - mkdir -p ../dir3 && touch file.txt
instructions: |
  Desde dir1, mueve file.txt al directorio dir3 (que está junto a dir1, dentro
  de taller).
checks:
  - type: fs
    exists: [taller/dir3/file.txt]
    absent: [taller/dir1/file.txt]
solution: "mv file.txt ../dir3"
time_limit_sec: 60
lesson_time_limit_sec: 999999
hints:
  - "mv origen destino"
  - "El directorio padre se escribe .."
