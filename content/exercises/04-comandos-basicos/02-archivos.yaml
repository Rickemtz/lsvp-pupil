id: basicos-011
module: 4
kind: practice
difficulty: 1
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_2/04_comandos_basicos.html#eliminar-un-directorio-vacío-rmdir
fixture: taller
start_dir: taller
setup:
  - mkdir dir4
instructions: |
  Elimina el directorio dir4, que está vacío.
checks:
  - type: fs
    absent: [taller/dir4]
solution: "rmdir dir4"
explanation: |
  rmdir solo borra directorios vacíos, así que es una forma segura de limpiar.
time_limit_sec: 45
lesson_time_limit_sec: 999999
hints:
  - "Hay un comando especial para borrar directorios vacíos."
