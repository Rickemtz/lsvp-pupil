id: basicos-010
module: 4
kind: practice
difficulty: 1
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_2/04_comandos_basicos.html#renombrar-un-directorio-o-archivo-mv
fixture: taller
start_dir: taller/dir1
setup:
  - touch documento
instructions: |
  Cambia el nombre del archivo documento a ejercicio.
checks:
  - type: fs
    exists: [taller/dir1/ejercicio]
    absent: [taller/dir1/documento]
solution: "mv documento ejercicio"
explanation: |
  Renombrar es mover un archivo a un nombre nuevo en el mismo directorio.
