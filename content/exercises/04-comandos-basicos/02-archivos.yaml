id: basicos-012
module: 4
kind: practice
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_2/04_comandos_basicos.html#eliminar-archivos-rm
fixture: taller
start_dir: taller
setup:
  - mkdir -p dir1 && touch dir1/file.txt dir1/file2.txt
instructions: |
  Sin salir de taller, borra el archivo file2.txt que está en dir1. No borres
  file.txt.
checks:
  - type: fs
    absent: [taller/dir1/file2.txt]
    exists: [taller/dir1/file.txt]
solution: "rm dir1/file2.txt"
time_limit_sec: 45
lesson_time_limit_sec: 999999
hints:
  - "rm acepta rutas relativas."
---
id: basicos-013
module: 4
kind: practice
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_2/04_comandos_basicos.html#eliminar-archivos-rm
fixture: taller
start_dir: taller
setup:
  - mkdir -p proyecto/linux/basico && touch proyecto/documento proyecto/linux/notas
instructions: |
  Elimina el directorio proyecto con todo su contenido.
checks:
  - type: fs
    absent: [taller/proyecto]
solution: "rm -r proyecto"
explanation: |
  rmdir no sirve porque proyecto no está vacío. rm -r borra de manera
  recursiva, y no pide confirmación: úsalo con cuidado.
time_limit_sec: 60
lesson_time_limit_sec: 999999
hints:
  - "El directorio no está vacío, así que rmdir no alcanza."
  - "rm con la opción recursiva."
