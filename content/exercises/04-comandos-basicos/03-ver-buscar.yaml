---
id: basicos-015
module: 4
kind: practice
difficulty: 3
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_2/04_comandos_basicos.html#dónde-lo-encuentro-find
fixture: taller
start_dir: taller
instructions: |
  Con find, busca dentro de taller los archivos cuyo nombre empieza con eje y
  termina en .txt.
checks:
  - type: output
    mode: regex
    expected: '(?m)/ejeDatos\.txt$'
  - type: output
    mode: regex
    expected: '(?m)/eje_practica\.txt$'
  - type: output
    mode: regex
    expected: '(?m)/ejemplo\.txt$'
  - type: output
    mode: regex
    expected: '(?m)/ejes\.txt$'
solution: "find . -name 'eje*.txt'"
explanation: |
  El * es un comodín. Ponlo entre comillas para que lo interprete find y no el
  shell. notas_eje1.txt no aparece porque no empieza con eje.
time_limit_sec: 90
hints:
  - "find dónde -name 'patrón'"
  - "El patrón usa * como comodín: 'eje*.txt'"
