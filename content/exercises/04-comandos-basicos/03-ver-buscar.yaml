id: basicos-014
module: 4
kind: practice
difficulty: 1
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_2/04_comandos_basicos.html#qué-está-escrito-aquí-cat
fixture: taller
start_dir: taller/dia-1
instructions: |
  Muestra el contenido de Dewey.txt y de frases.txt con una sola instrucción.
checks:
  - type: output
    mode: same_as_solution
