module: 5
kind: quiz
format: multiple_choice
difficulty: 1
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_2/05_instalacion_de_paquetes.html#herramientas-del-proyecto-gnu
question: |
  ¿Qué es GCC?
options:
  - "Una colección de compiladores que convierte código fuente en programas ejecutables"
  - "Un gestor de paquetes de Fedora"
  - "Un editor de texto"
  - "Un servidor de repositorios"
answer: "Una colección de compiladores que convierte código fuente en programas ejecutables"
explanation: |
  GCC (GNU Compiler Collection) compila C, C++, Fortran, Go y otros lenguajes.
time_limit_sec: 20
hints:
  - "La última C es de «collection»; la segunda, de «compiler»."
