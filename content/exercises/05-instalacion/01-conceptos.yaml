question: |
  ¿En qué distribución se usa pacman para instalar paquetes?
options: ["Arch Linux", "Ubuntu", "Fedora", "Debian"]
answer: "Arch Linux"
explanation: |
  apt es de Debian y Ubuntu, dnf de Fedora y Red Hat, y pacman de Arch (y
  derivadas como Manjaro o CachyOS).
