id: inst-005
module: 5
kind: quiz
format: multiple_choice
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_2/05_instalacion_de_paquetes.html#herramientas-del-proyecto-gnu
question: |
  ¿Qué hace el script ./configure que traen muchos programas en código fuente?
options:
  - "Revisa tu sistema y genera el Makefile adecuado para él"
  - "Instala el programa en /usr/bin"
  - "Borra los archivos temporales de la compilación"
  - "Configura la red"
answer: "Revisa tu sistema y genera el Makefile adecuado para él"
explanation: |
  configure (generado con Autoconf) detecta compilador, bibliotecas y sistema, y
  escribe un Makefile a la medida. El orden típico es ./configure, make y make install.
time_limit_sec: 25
hints:
  - "Va antes de make."
