id: inst-004
module: 5
kind: quiz
format: multiple_choice
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_2/05_instalacion_de_paquetes.html#herramientas-del-proyecto-gnu
question: |
  ¿Para qué sirve make?
options:
  - "Automatiza la compilación siguiendo las reglas de un archivo Makefile"
  - "Crea directorios nuevos"
  - "Descarga paquetes de internet"
  - "Genera llaves SSH"
answer: "Automatiza la compilación siguiendo las reglas de un archivo Makefile"
explanation: |
  En un proyecto grande hay muchos archivos que compilar en orden. make lee el
  Makefile y hace solo lo necesario.
time_limit_sec: 25
hints:
  - "Su archivo de reglas lleva su nombre."
