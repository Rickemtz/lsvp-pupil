source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_2/05_instalacion_de_paquetes.html#formatos-y-comandos-básicos
question: |
  ¿Qué formato de paquete usan Debian, Ubuntu y Linux Mint?
options: [".deb", ".rpm", ".exe", ".dmg"]
answer: ".deb"
explanation: |
  La familia Debian usa .deb (con dpkg y apt); la familia Red Hat usa .rpm (con
  rpm y dnf).
time_limit_sec: 20
hints:
  - "Las tres primeras letras de Debian."
