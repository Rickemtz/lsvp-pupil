id: inst-009
module: 5
kind: quiz
format: multiple_choice
difficulty: 1
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_2/05_instalacion_de_paquetes.html#3-manejadores-de-paquetes-de-alto-nivel
question: |
  ¿Qué es un repositorio de software?
options:
  - "Un servidor que guarda los paquetes de una distribución, revisados para que funcionen juntos"
  - "Una carpeta en tu home donde se guardan descargas"
  - "Un programa para compilar"
  - "Una lista de contraseñas"
answer: "Un servidor que guarda los paquetes de una distribución, revisados para que funcionen juntos"
explanation: |
  Los desarrolladores de la distribución mantienen los repositorios para asegurar
  compatibilidad y seguridad. apt, dnf y pacman descargan de ahí.
time_limit_sec: 25
hints:
  - "Es un almacén."
