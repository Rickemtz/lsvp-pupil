id: inst-010
module: 5
kind: quiz
format: multiple_choice
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_2/05_instalacion_de_paquetes.html#3-manejadores-de-paquetes-de-alto-nivel
question: |
  Instalas un programa con apt y resulta que necesita otras tres bibliotecas.
  ¿Qué hace apt que dpkg no hace?
options:
  - "Busca, descarga e instala también esas dependencias desde los repositorios"
  - "Compila el programa desde el código fuente"
  - "Nada: apt y dpkg hacen exactamente lo mismo"
  - "Ignora las dependencias"
answer: "Busca, descarga e instala también esas dependencias desde los repositorios"
explanation: |
  dpkg (bajo nivel) instala un .deb que ya tienes. apt (alto nivel) se conecta a
  los repositorios y resuelve las dependencias por ti.
time_limit_sec: 30
hints:
  - "Alto nivel = más automático."
---
id: inst-011
module: 5
kind: quiz
format: true_false
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_2/05_instalacion_de_paquetes.html#comandos-de-uso-diario
question: |
  «apt update» instala las versiones nuevas de todos tus programas.
answer: "falso"
explanation: |
  apt update solo actualiza la lista de paquetes disponibles. Lo que instala las
  versiones nuevas es apt upgrade; por eso suelen ir juntos: apt update && apt upgrade.
time_limit_sec: 25
hints:
  - "Uno actualiza la lista; el otro, los programas."
---
