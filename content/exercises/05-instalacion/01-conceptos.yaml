question: |
  ¿Qué contiene un paquete de software?
options:
  - "Los programas ya compilados, su configuración, scripts de instalación y la lista de dependencias"
  - "Solo el código fuente"
  - "Solo el manual del programa"
  - "Una copia del sistema operativo completo"
answer: "Los programas ya compilados, su configuración, scripts de instalación y la lista de dependencias"
explanation: |
  Un paquete trae todo listo para instalar, e indica qué otros paquetes necesita.
time_limit_sec: 25
hints:
  - "Ya viene compilado."
