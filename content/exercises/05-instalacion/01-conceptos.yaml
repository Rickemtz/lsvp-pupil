# Módulo 5 · Compilación, paquetes y repositorios.
id: inst-001
module: 5
kind: quiz
format: multiple_choice
difficulty: 1
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_2/05_instalacion_de_paquetes.html#ventajas-y-desventajas-de-compilar
question: |
  ¿Cuál es una ventaja de compilar un programa desde su código fuente?
options:
  - "Puedes adaptarlo y optimizarlo para tu hardware"
  - "Es siempre más rápido que instalar un paquete"
  - "No necesitas saber nada técnico"
  - "Se actualiza solo"
answer: "Puedes adaptarlo y optimizarlo para tu hardware"
explanation: |
  Compilar da control total: eliges opciones, versiones y optimizaciones. A
  cambio, pide tiempo y conocimientos.
time_limit_sec: 20
hints:
  - "Piensa en «control»."
---
id: inst-002
module: 5
kind: quiz
format: multiple_choice
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_2/05_instalacion_de_paquetes.html#ventajas-y-desventajas-de-compilar
question: |
  Compilaste a mano veinte programas. Un año después, ¿cuál es el problema más
  probable?
options:
  - "Es difícil saber qué tienes instalado y mantenerlo actualizado"
  - "Los programas dejan de funcionar al cumplir un año"
  - "El kernel borra los programas compilados"
  - "Ninguno: compilar no tiene desventajas"
answer: "Es difícil saber qué tienes instalado y mantenerlo actualizado"
explanation: |
  Sin un sistema de paquetes, tú llevas el control de versiones, dependencias y
  actualizaciones. Justo para eso surgieron los paquetes.
time_limit_sec: 25
hints:
  - "¿Quién lleva la cuenta de lo instalado?"
