# Módulo 5 · Comandos de los gestores de paquetes. Son ejercicios pattern: no se instala nada.
id: inst-p01
module: 5
kind: practice
difficulty: 1
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_2/05_instalacion_de_paquetes.html#comandos-de-uso-diario
instructions: |
  Estás en Ubuntu. Instala el paquete cowsay.
checks:
  - type: pattern
    accepted:
      - '(sudo )?apt(-get)? install( -y)? cowsay( -y)?'
solution: "sudo apt install cowsay"
time_limit_sec: 45
lesson_time_limit_sec: 999999
hints:
  - "En Ubuntu el gestor es apt; instalar es install."
  - "Para instalar hace falta sudo."
