id: inst-p03
module: 5
kind: practice
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_2/05_instalacion_de_paquetes.html#comandos-de-uso-diario
instructions: |
  Estás en Arch Linux. Busca en los repositorios el juego moon-buggy.
checks:
  - type: pattern
    accepted:
      - '(sudo )?pacman -Ss moon-buggy'
solution: "pacman -Ss moon-buggy"
explanation: |
  -S sincroniza con los repositorios y s busca. Buscar no necesita sudo.
time_limit_sec: 60
lesson_time_limit_sec: 999999
hints:
  - "pacman usa opciones de letras: S de sync y s de search."
