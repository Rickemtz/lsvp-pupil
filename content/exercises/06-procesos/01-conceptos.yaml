id: proc-005
module: 6
kind: quiz
format: multiple_choice
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_3/06_procesos.html#uid-id-del-propietario
question: |
  ¿Quién puede enviarle señales (por ejemplo, terminarlo) a un proceso?
options:
  - "El usuario que lo creó y el superusuario (root)"
  - "Cualquier usuario del sistema"
  - "Solo el superusuario"
  - "Solo el propio proceso"
answer: "El usuario que lo creó y el superusuario (root)"
explanation: |
  El UID del proceso indica quién lo creó. Solo esa persona y root pueden
  manipularlo; así nadie termina los programas de otros.
time_limit_sec: 25
hints:
  - "Su dueño... y alguien más."
