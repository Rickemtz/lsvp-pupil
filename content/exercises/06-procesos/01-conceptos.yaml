id: proc-004
module: 6
kind: quiz
format: true_false
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_3/06_procesos.html#pid-id-de-proceso
question: |
  Los PID se asignan en orden conforme se crean los procesos.
answer: "verdadero"
explanation: |
  El kernel va asignando números crecientes; cuando llega al máximo vuelve a
  empezar con los números que ya se liberaron.
time_limit_sec: 20
hints:
  - "Piensa en turnos numerados."
