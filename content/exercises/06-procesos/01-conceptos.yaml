id: proc-003
module: 6
kind: quiz
format: multiple_choice
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_3/06_procesos.html#ppid-id-del-proceso-padre
question: |
  Desde bash ejecutas «sleep 60 &». ¿Cuál es el PPID del proceso sleep?
options:
  - "El PID del bash que lo lanzó"
  - "El PID de sleep más uno"
  - "Siempre 1"
  - "El UID de tu usuario"
answer: "El PID del bash que lo lanzó"
explanation: |
  El proceso que crea a otro es su padre. El PPID (Parent PID) de sleep es el
  PID de la shell que lo ejecutó.
time_limit_sec: 25
hints:
  - "La P extra es de «parent»."
