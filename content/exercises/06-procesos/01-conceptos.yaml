id: proc-011
module: 6
kind: quiz
format: multiple_choice
difficulty: 1
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_3/06_procesos.html#actividades
question: |
  ¿Qué hace el & al final de «sleep 300 &»?
options:
  - "Ejecuta el comando en segundo plano y te devuelve el prompt"
  - "Ejecuta el comando dos veces"
  - "Guarda la salida en un archivo"
  - "Lo ejecuta como administrador"
answer: "Ejecuta el comando en segundo plano y te devuelve el prompt"
explanation: |
  Con & la shell no espera a que termine: puedes seguir escribiendo comandos.
  «echo $!» muestra el PID del último proceso en segundo plano.
time_limit_sec: 20
hints:
  - "Segundo plano."
