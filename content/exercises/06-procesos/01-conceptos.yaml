# Módulo 6 · Procesos: PID, PPID, UID, /proc, señales.
id: proc-001
module: 6
kind: quiz
format: multiple_choice
difficulty: 1
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_3/06_procesos.html#procesos
question: |
  ¿Qué es un proceso?
options:
  - "Un programa en ejecución"
  - "Un archivo ejecutable guardado en el disco"
  - "Una línea de un script"
  - "Un usuario del sistema"
answer: "Un programa en ejecución"
explanation: |
  El archivo /usr/bin/sleep es un programa; cada vez que lo ejecutas se crea un
  proceso, con su memoria, su tiempo de CPU y sus archivos abiertos.
time_limit_sec: 20
hints:
  - "La diferencia entre la receta y el pastel en el horno."
