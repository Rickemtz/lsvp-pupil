id: proc-006
module: 6
kind: quiz
format: multiple_choice
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_3/06_procesos.html#elementos
question: |
  El kernel expone información de cada proceso (estado, memoria, archivos
  abiertos) como archivos. ¿En qué directorio?
options: ["/proc", "/dev", "/var", "/tmp"]
answer: "/proc"
explanation: |
  Cada proceso tiene un directorio /proc/PID. Por ejemplo, /proc/1234/status
  muestra el estado del proceso 1234. «Todo es un archivo».
time_limit_sec: 20
hints:
  - "Viene de «process»."
