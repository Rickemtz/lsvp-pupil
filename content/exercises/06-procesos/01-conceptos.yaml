id: proc-010
module: 6
kind: quiz
format: multiple_choice
difficulty: 3
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_3/06_procesos.html#señal-term
question: |
  ¿Por qué conviene intentar primero con TERM antes que con KILL?
options:
  - "Porque TERM deja que el proceso limpie su estado (guarde, cierre archivos) antes de salir"
  - "Porque TERM es más rápido"
  - "Porque KILL reinicia la computadora"
  - "Porque KILL solo funciona como root"
answer: "Porque TERM deja que el proceso limpie su estado (guarde, cierre archivos) antes de salir"
explanation: |
  TERM es una petición: el programa puede terminar ordenadamente. KILL lo corta
  de golpe y puede dejar archivos a medias.
time_limit_sec: 30
hints:
  - "Una es una petición amable; la otra, no."
