format: multiple_choice
difficulty: 1
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_3/06_procesos.html#señal-int
question: |
  ¿Qué señal envías al proceso que corre en la terminal cuando presionas Ctrl-C?
options: ["INT", "KILL", "TERM", "HUP"]
answer: "INT"
explanation: |
  Ctrl-C manda INT (interrupt): una solicitud para detener lo que se está
  ejecutando.
time_limit_sec: 20
hints:
