id: proc-002
module: 6
kind: quiz
format: multiple_choice
difficulty: 1
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_3/06_procesos.html#pid-id-de-proceso
question: |
  ¿Qué es el PID?
options:
  - "El número único que el kernel asigna a cada proceso"
  - "La prioridad del proceso"
  - "El usuario dueño del proceso"
  - "El nombre del programa"
answer: "El número único que el kernel asigna a cada proceso"
explanation: |
  Casi todos los comandos que actúan sobre procesos, como kill, necesitan el PID
  para saber a cuál dirigirse.
time_limit_sec: 20
hints:
  - "Process ID."
