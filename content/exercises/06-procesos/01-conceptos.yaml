id: proc-008
module: 6
kind: quiz
format: multiple_choice
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_3/06_procesos.html#señal-kill
question: |
  ¿Qué señal no puede ser ignorada, bloqueada ni manejada por el proceso?
options: ["KILL", "TERM", "INT", "HUP"]
answer: "KILL"
explanation: |
  Con KILL el kernel termina el proceso directamente, sin darle oportunidad de
  reaccionar. Por eso es el último recurso.
time_limit_sec: 20
hints:
  - "Es la señal número 9."
