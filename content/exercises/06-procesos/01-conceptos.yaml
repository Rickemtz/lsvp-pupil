id: proc-009
module: 6
kind: quiz
format: true_false
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_3/06_procesos.html#cómo-envío-una-señal
question: |
  «kill PID», sin opciones, envía la señal KILL.
answer: "falso"
explanation: |
  Por omisión kill envía TERM. Para KILL hay que pedirlo: kill -s KILL PID o
  kill -9 PID.
time_limit_sec: 20
hints:
  - "El nombre del comando engaña."
