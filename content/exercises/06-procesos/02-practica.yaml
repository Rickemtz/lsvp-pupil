# Módulo 6 · Práctica con ps y kill. El setup deja procesos en segundo plano.
id: proc-p01
module: 6
kind: practice
difficulty: 1
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_3/06_procesos.html#ejemplo-1
fixture: taller
start_dir: taller
instructions: |
  Muestra todos los procesos del sistema, con su usuario y su uso de CPU y
  memoria (el formato que usa el curso).
checks:
  - type: output
    mode: regex
    expected: '(?m)^USER\s+PID\s+%CPU\s+%MEM'
solution: "ps aux"
explanation: |
  a: procesos de todos los usuarios; u: formato con usuario, CPU y memoria;
  x: también los que no tienen terminal.
time_limit_sec: 45
lesson_time_limit_sec: 999999
hints:
  - "ps con las opciones a, u y x."
---
id: proc-p02
module: 6
kind: practice
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_3/06_procesos.html#actividades
fixture: taller
start_dir: taller
setup:
  - sleep 100000 &
instructions: |
  Hay un proceso sleep corriendo en segundo plano. Verifica que está en
  ejecución: muestra la lista completa de procesos, pero solo las líneas que
  contienen «sleep».
checks:
  - type: output
    mode: regex
    expected: 'sleep 100000'
solution: "ps aux | grep sleep"
explanation: |
  El pipe manda la salida de ps a grep, que deja solo las líneas con «sleep».
  También aparece el propio grep, porque su línea de comando contiene la palabra.
time_limit_sec: 60
lesson_time_limit_sec: 999999
hints:
  - "ps aux muestra todo; grep filtra."
  - "Únelos con |"
---
id: proc-p03
module: 6
kind: practice
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_3/06_procesos.html#cómo-envío-una-señal
fixture: taller
start_dir: taller
setup:
  - sleep 100000 &
instructions: |
  Termina el proceso sleep que corre en segundo plano usando kill con su señal
  por omisión. Puedes ver su PID con ps.
checks:
  - type: process
    process: sleep
    signal: TERM
solution: "kill %1"
explanation: |
  kill PID (o kill %1, «el trabajo 1 de esta shell») envía TERM.
time_limit_sec: 60
lesson_time_limit_sec: 999999
hints:
  - "Busca el PID con ps."
  - "kill PID"
---
id: proc-p04
module: 6
kind: practice
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_3/06_procesos.html#señal-kill
fixture: taller
start_dir: taller
setup:
  - sleep 100000 &
instructions: |
  Termina el proceso sleep con la señal que no se puede ignorar.
checks:
  - type: process
    process: sleep
    signal: KILL
solution: "kill -9 %1"
explanation: |
  kill -s KILL PID, kill -KILL PID y kill -9 PID son equivalentes.
time_limit_sec: 60
lesson_time_limit_sec: 999999
hints:
  - "La señal es KILL."
  - "kill -s SEÑAL PID"
---
id: proc-p05
module: 6
kind: practice
difficulty: 3
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_3/06_procesos.html#señal-int
fixture: taller
start_dir: taller
setup:
  - env --default-signal=INT sleep 100000 > /dev/null 2>&1 &
instructions: |
  Envía al proceso sleep la misma señal que manda Ctrl-C, usando kill -s.
checks:
  - type: process
    process: sleep
    signal: INT
solution: "kill -s INT %1"
explanation: |
  Ctrl-C solo funciona con lo que corre en primer plano. Para un proceso en
  segundo plano, la misma señal se manda con kill -s INT.
time_limit_sec: 60
lesson_time_limit_sec: 999999
hints:
  - "Ctrl-C manda INT."
  - "kill -s INT PID"
---
id: proc-p06
module: 6
kind: practice
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_3/06_procesos.html#actividades
fixture: taller
start_dir: taller
instructions: |
  Lanza «sleep 300» en segundo plano y, en la misma línea, muestra su PID.
checks:
  - type: output
    mode: regex
    expected: '^[0-9]+\n?$'
solution: "sleep 300 & echo $!"
explanation: |
  $! guarda el PID del último proceso que lanzaste en segundo plano.
time_limit_sec: 60
lesson_time_limit_sec: 999999
hints:
  - "& lo manda a segundo plano."
  - "La variable $! tiene el PID del último proceso en segundo plano."
