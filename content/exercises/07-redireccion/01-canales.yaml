# Módulo 7 · STDIN, STDOUT, STDERR y los operadores de redirección.
id: red-001
module: 7
kind: quiz
format: multi_select
difficulty: 1
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_3/07_filtrado.html#_ahora_seamos_más_técnicos
question: |
  ¿Cuáles son los tres canales de comunicación que tiene todo proceso?
  Marca todos.
options: ["Entrada estándar (STDIN)", "Salida estándar (STDOUT)", "Error estándar (STDERR)", "Red estándar (STDNET)"]
answer: ["Entrada estándar (STDIN)", "Salida estándar (STDOUT)", "Error estándar (STDERR)"]
explanation: |
  STDIN (descriptor 0) es por donde lee, STDOUT (1) por donde escribe sus
  resultados y STDERR (2) por donde escribe los mensajes de error.
time_limit_sec: 30
