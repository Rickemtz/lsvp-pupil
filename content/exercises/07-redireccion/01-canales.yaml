question: |
  notas.txt ya tiene texto. ¿Qué pasa con ese texto al ejecutar
  «echo hola > notas.txt»?
options:
  - "Se borra: notas.txt queda solo con «hola»"
  - "Se conserva y «hola» se agrega al final"
  - "Se conserva y «hola» se agrega al inicio"
  - "El comando falla porque el archivo ya existe"
answer: "Se borra: notas.txt queda solo con «hola»"
explanation: |
  > sustituye el contenido. Para agregar al final sin borrar se usa >>.
time_limit_sec: 25
lesson_time_limit_sec: 999999
hints:
  - "Un solo > sobrescribe."
