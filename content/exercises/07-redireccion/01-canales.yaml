source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_3/07_filtrado.html#_ahora_seamos_más_técnicos
question: |
  ¿Qué guarda «ls /no/existe 2> errores.txt» en errores.txt?
options:
  - "El mensaje de error de ls"
  - "La lista de archivos"
  - "Las dos cosas"
  - "Nada, porque el 2 es el número de líneas a guardar"
answer: "El mensaje de error de ls"
explanation: |
  2 es el descriptor de STDERR. 2> redirige solo los errores; la salida normal
  sigue saliendo en pantalla.
time_limit_sec: 25
lesson_time_limit_sec: 999999
hints:
  - "¿Qué canal tiene el número 2?"
