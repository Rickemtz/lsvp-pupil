id: red-p05
module: 7
kind: practice
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_3/07_filtrado.html#_ahora_seamos_más_técnicos
fixture: taller2
start_dir: taller2/dia3/redireccionYPipes/red_pipes
instructions: |
  Muestra cuántas líneas tiene poesia_artificial usando wc -l, pero haz que wc
  lea el archivo desde su entrada estándar con <, para que solo muestre el
  número (sin el nombre del archivo).
checks:
  - type: output
    mode: same_as_solution
solution: "wc -l < poesia_artificial"
explanation: |
  Con «wc -l poesia_artificial», wc conoce el nombre y lo imprime. Con <, la
  shell le pasa el contenido por STDIN y wc no sabe de qué archivo viene.
time_limit_sec: 60
hints:
  - "comando < archivo"
