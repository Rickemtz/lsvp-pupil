  - cat poesia_artificial > poesia_redireccionada
instructions: |
  Agrega la línea «Esto es una copia de red_pipes/poesia_artificial» al final de
  poesia_redireccionada usando echo, sin borrar lo que ya tiene.
checks:
  - type: fs
    line_count:
      taller2/dia3/redireccionYPipes/red_pipes/poesia_redireccionada: 15
    content_contains:
      taller2/dia3/redireccionYPipes/red_pipes/poesia_redireccionada: "Esto es una copia de red_pipes/poesia_artificial\n"
solution: 'echo "Esto es una copia de red_pipes/poesia_artificial" >> poesia_redireccionada'
