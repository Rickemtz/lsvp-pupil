id: red-p10
module: 7
kind: practice
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_3/07_filtrado.html#_volvamos_a_ser_un_poco_más_técnicos
fixture: taller2
start_dir: taller2/dia3/redireccionYPipes/red_pipes
instructions: |
  ¿Cuántos programas hay en /usr/bin? Cuéntalos uniendo ls y wc con un pipe.
checks:
  - type: output
    mode: same_as_solution
solution: "ls /usr/bin | wc -l"
explanation: |
  Cuando ls escribe a un pipe pone un nombre por línea, así que wc -l cuenta
  archivos.
time_limit_sec: 60
hints:
  - "wc -l cuenta líneas."
