instructions: |
  Ordena las líneas de datos.csv alfabéticamente por el nombre (segundo campo).
checks:
  - type: output
    mode: same_as_solution
solution: "sort -t ',' -k 2 datos.csv"
explanation: |
  -t indica el separador de campos y -k el campo por el que se ordena.
time_limit_sec: 75
hints:
