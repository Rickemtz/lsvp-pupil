id: fil-p03
module: 8
kind: practice
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_3/07_filtrado.html#_prácticas
fixture: taller2
start_dir: taller2/dia3/redireccionYPipes/red_pipes
instructions: |
  ¿Cuántas líneas de datos.csv contienen «agua», sin importar si está en mayúsculas o minúsculas? Muestra solo el número.
checks:
  - type: output
    mode: same_as_solution
solution: "grep -i agua datos.csv | wc -l"
explanation: |
  Con -i, grep encuentra Agua (el tipo) y también «agua» en minúsculas dentro de algunos nombres. grep -ic agua datos.csv da el mismo número.
time_limit_sec: 75
hints:
  - "grep tiene una opción para ignorar mayúsculas."
  - "Cuenta las líneas con wc -l."
