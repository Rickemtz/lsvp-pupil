fixture: taller2
start_dir: taller2/dia3/redireccionYPipes/red_pipes
instructions: |
  Muestra el segundo y el sexto campo (nombre y hp) de las primeras 10 líneas de datos.csv.
checks:
  - type: output
    mode: same_as_solution
solution: "cut -d \",\" -f 2,6 datos.csv | head"
explanation: |
  Primero hay que saber que el separador es la coma (lo ves con head -n 1 datos.csv).
time_limit_sec: 90
hints:
  - "cut -d separador -f campos"
  - "head sin opciones muestra 10 líneas."
