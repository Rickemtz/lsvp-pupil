fixture: taller2
start_dir: taller2/dia3/redireccionYPipes/red_pipes
instructions: |
  Muestra las líneas 5 a 10 de datos.csv (contando el encabezado como línea 1).
checks:
  - type: output
    mode: same_as_solution
solution: "head -n 10 datos.csv | tail -n 6"
explanation: |
  head se queda con las primeras 10; de ellas, tail toma las últimas 6: de la 5 a la 10.
time_limit_sec: 90
hints:
  - "Primero corta con head hasta la línea 10."
  - "Luego tail con las que te sobran."
