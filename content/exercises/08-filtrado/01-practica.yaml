id: fil-p09
module: 8
kind: practice
difficulty: 3
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_3/07_filtrado.html#_práctica_4
fixture: taller2
start_dir: taller2/dia3/redireccionYPipes/red_pipes
instructions: |
  Muestra los 5 valores más altos de la columna total (quinto campo), de mayor a menor. Solo los números.
checks:
  - type: output
    mode: same_as_solution
solution: "cut -d ',' -f 5 datos.csv | sort -n -r | head -n 5"
explanation: |
  Sin -n, sort compara texto y «99» quedaría después de «600». -r invierte el orden.
time_limit_sec: 120
hints:
  - "Extrae la columna con cut."
  - "sort -n ordena como números y -r al revés."
