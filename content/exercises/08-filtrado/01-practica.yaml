id: fil-p13
module: 8
kind: practice
difficulty: 3
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_3/07_filtrado.html#_ejemplos_prácticos
fixture: taller2
start_dir: taller2/dia3/redireccionYPipes/red_pipes
instructions: |
  ¿Qué tipo (columna tipo1) aparece más veces? Usa uniq -c para mostrar la cuenta y el tipo, en una sola línea.
checks:
  - type: output
    mode: same_as_solution
solution: "tail -n +2 datos.csv | cut -d ',' -f 3 | sort | uniq -c | sort -n -r | head -n 1"
explanation: |
  uniq solo junta líneas iguales consecutivas: por eso hay que ordenar antes. Luego se ordena por la cuenta.
time_limit_sec: 150
hints:
  - "Extrae la columna 3 y ordénala."
  - "uniq -c cuenta repeticiones."
  - "Ordena por número al revés y quédate con la primera línea."
---
id: fil-p14
module: 8
kind: practice
difficulty: 3
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_3/07_filtrado.html#uniq
fixture: taller2
start_dir: taller2/dia3/redireccionYPipes/red_pipes
instructions: |
  Muestra todos los tipos de la columna tipo1, sin repetir y sin incluir el encabezado.
checks:
  - type: output
    mode: same_as_solution
solution: "tail -n +2 datos.csv | cut -d ',' -f 3 | sort | uniq"
explanation: |
  sort -u hace lo mismo que sort | uniq.
time_limit_sec: 120
hints:
  - "Recuerda saltarte el encabezado."
  - "uniq necesita la entrada ordenada."
