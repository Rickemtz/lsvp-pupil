# Módulo 8 · Filtrado sobre datos.csv. Todo se compara con la salida de la solución.
id: fil-p01
module: 8
kind: practice
difficulty: 1
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_3/07_filtrado.html#_obtengamos_un_poco_de_información_de_los_archivos
fixture: taller2
start_dir: taller2/dia3/redireccionYPipes/red_pipes
instructions: |
  Muestra el total de líneas, palabras y caracteres de datos.csv.
checks:
  - type: output
    mode: same_as_solution
solution: "wc datos.csv"
explanation: |
  Sin opciones, wc muestra las tres cuentas: líneas, palabras y bytes.
