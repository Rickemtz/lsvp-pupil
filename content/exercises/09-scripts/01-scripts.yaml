id: scr-13
module: 9
kind: script
difficulty: 3
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_4/08_scripts.html#redireccionamiento
fixture: taller
start_dir: taller
filename: contar_lineas.sh
instructions: "Crea el script contar_lineas.sh que reciba un archivo como argumento. Si existe, escribe en salida.txt solo el número de líneas del archivo, reemplazando lo que tuviera. Si no existe, muestra un mensaje de error y termina con código de salida 1."
tests:
  - args: ["ejemplo.txt"]
    files: {"salida.txt": "4\n"}
  - args: ["dia-1/Dewey.txt"]
    files: {"salida.txt": "16\n"}
  - args: ["nada.txt"]
    exit_code: 1
require_shebang: true
solution_file: solutions/contar_lineas.sh
explanation: "wc -l < archivo da solo el número. > reemplaza el contenido de salida.txt; con >> los números se irían acumulando. exit 1 termina el script con código 1, que indica un error."
time_limit_sec: 480
hints:
  - "if [ -f \"$1\" ]; then ... else ... fi"
  - "wc -l < \"$1\" > salida.txt"
  - "exit 1 termina con código 1."
