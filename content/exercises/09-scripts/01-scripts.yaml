id: scr-14
module: 9
kind: script
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_4/08_scripts.html#códigos-de-salida
fixture: taller
start_dir: taller
filename: validar_args.sh
instructions: "Crea el script validar_args.sh. Si no recibe argumentos, muestra «Uso: validar_args.sh ARCHIVO» y termina con código de salida 1. Si recibe uno, muestra «Recibí: » seguido del argumento y termina con código 0."
tests:
  - stdout_contains: "Uso: validar_args.sh ARCHIVO"
    exit_code: 1
  - args: ["datos.txt"]
    stdout_contains: "Recibí: datos.txt"
    exit_code: 0
require_shebang: true
solution_file: solutions/validar_args.sh
explanation: "$# dice cuántos argumentos llegaron. Terminar con exit 1 permite que otros comandos sepan que algo salió mal, por ejemplo con && o ||."
time_limit_sec: 420
hints:
  - "if [ $# -eq 0 ]; then ... fi"
  - "exit 1 termina el script con ese código."
