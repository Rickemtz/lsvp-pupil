id: scr-08
module: 9
kind: script
difficulty: 3
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_4/08_scripts.html#while
fixture: taller
start_dir: taller
filename: cuenta_atras.sh
instructions: "Crea el script cuenta_atras.sh que reciba un número y muestre una cuenta regresiva hasta 0, un número por línea."
tests:
  - args: ["3"]
    stdout_regex: "\\A3\\n2\\n1\\n0\\n?\\z"
  - args: ["5"]
    stdout_regex: "\\A5\\n4\\n3\\n2\\n1\\n0\\n?\\z"
require_shebang: true
solution_file: solutions/cuenta_atras.sh
explanation: "(( )) hace aritmética: ((n--)) resta uno a n. Sin actualizar la variable, el while nunca terminaría."
time_limit_sec: 480
hints:
  - "while [ \"$n\" -ge 0 ]; do ... done"
  - "((n--)) resta uno."
