filename: suma.sh
instructions: "Crea el script suma.sh que reciba un número N y muestre «La suma es X», donde X es 1 + 2 + ... + N. Usa un for estilo C."
tests:
  - args: ["10"]
    stdout_contains: "La suma es 55"
  - args: ["100"]
    stdout_contains: "La suma es 5050"
require_shebang: true
solution_file: solutions/suma.sh
