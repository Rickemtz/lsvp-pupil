# Módulo 9 · Scripts. Cada ejercicio se prueba con bash ./filename y sus tests.
id: scr-01
module: 9
kind: script
difficulty: 1
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_4/08_scripts.html#scripts
fixture: taller
start_dir: taller
filename: hola.sh
instructions: "Crea el script hola.sh que muestre el mensaje «¡Hola, mundo!». Empieza con el shebang de bash."
tests:
  - stdout_contains: "¡Hola, mundo!"
require_shebang: true
solution_file: solutions/hola.sh
explanation: "La primera línea, #!/bin/bash, indica qué programa ejecuta el script. Las líneas que empiezan con # son comentarios."
time_limit_sec: 300
hints:
  - "La primera línea es #!/bin/bash"
  - "echo muestra texto."
