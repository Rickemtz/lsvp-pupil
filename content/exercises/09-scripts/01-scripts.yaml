id: scr-06
module: 9
kind: script
difficulty: 3
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_4/08_scripts.html#condicionales
fixture: taller
start_dir: taller
filename: comparar.sh
instructions: "Crea el script comparar.sh que reciba un número como argumento y diga si es mayor, menor o igual a 10 (usa las palabras «mayor», «menor» o «igual»)."
tests:
  - args: ["15"]
    stdout_regex: "^[^\\n]*mayor[^\\n]*\\n?$"
  - args: ["3"]
    stdout_regex: "^[^\\n]*menor[^\\n]*\\n?$"
  - args: ["10"]
    stdout_regex: "^[^\\n]*igual[^\\n]*\\n?$"
require_shebang: true
solution_file: solutions/comparar.sh
explanation: "Para comparar números en [ ] se usan -gt, -lt, -eq... Deja espacios alrededor de los corchetes."
time_limit_sec: 480
hints:
  - "if [ \"$1\" -gt 10 ]; then ... elif ...; else ...; fi"
  - "-gt: mayor que, -lt: menor que."
