id: scr-05
module: 9
kind: script
difficulty: 2
source: https://lsvp-uami.github.io/mdbook-curso-linux-0/dia_4/08_scripts.html#argumentos-de-un-script
fixture: taller
start_dir: taller
filename: argumentos.sh
instructions: "Crea el script argumentos.sh que muestre: su propio nombre, el primer argumento, el segundo argumento, el total de argumentos y todos los argumentos (en ese orden)."
tests:
  - args: ["hola", "1234", "verde"]
    stdout_regex: "argumentos\\.sh[\\s\\S]*hola[\\s\\S]*1234[\\s\\S]*3[\\s\\S]*hola 1234 verde"
  - args: ["a", "b", "c", "d"]
    stdout_regex: "argumentos\\.sh[\\s\\S]*a[\\s\\S]*b[\\s\\S]*4[\\s\\S]*a b c d"
